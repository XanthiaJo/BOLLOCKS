<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>BOLLOCKS · Connection</title>
<link rel="stylesheet" href="layout.css">
<style>
#content{padding:0}
main{max-width:860px;margin:24px auto;padding:0 16px;overflow-y:auto}
.prof{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border:1px solid #2a2b2e;border-radius:6px;margin-bottom:10px;background:#141517}
.prof.on{border-color:#4a7c3a}
.prof.sel{border-color:#3a5ccc}
.prof .name{font-weight:700}
.prof .url{color:#abc;font-size:.9em}
.prof .meta{color:#567;font-size:.8em;margin-top:4px}
.prof .btns{display:flex;flex-direction:column;gap:6px}
.prof button{width:auto}
button.del{background:#7c3a3a}
button.act{background:#4a7c3a}
.badge{display:inline-block;background:#4a7c3a;color:#fff;font-size:.75em;padding:1px 7px;border-radius:8px;margin-left:6px;vertical-align:middle}
#editor{display:none;border:1px solid #2b3a5e;border-radius:6px;padding:14px;background:#191b24;margin-bottom:14px}
#editor h3{margin-top:0}
#editor input:not([type=checkbox]){width:100%}
</style>
</head>
<body>
<aside id="rsidebar">
  <h3>Profiles</h3>
  <div id="list"></div>
  <button onclick="newProf()" style="width:100%;margin-top:8px">+ New profile</button>
</aside>
<div id="content">
<main>
  <div id="editor">
    <h3 id="edtitle">New profile</h3>
    <input type="hidden" id="ed_id">
    <input id="ed_name" placeholder="Profile name e.g. OpenRouter free">
    <input id="ed_url" placeholder="API URL e.g. https://openrouter.ai/api/v1">
    <div style="display:flex;gap:6px">
      <input id="ed_model" list="modelist" placeholder="Model e.g. openrouter/free" style="flex:1">
      <datalist id="modelist"></datalist>
      <button onclick="fetchModels()" style="white-space:nowrap">Models ▾</button>
    </div>
    <input id="ed_key" type="password" placeholder="API key (blank keeps existing)">
    <input id="ed_headers" placeholder='Extra headers — JSON or "name: value" lines' title="Merged into every request (e.g. OpenRouter HTTP-Referer)">
    <h4 style="margin:14px 0 4px;color:#789">Chat Completion</h4>
    <label class="cap">Context Size <small>— prompt token cap, 0 = unlimited</small></label>
    <input id="ed_ctx" type="number" min="0" step="512">
    <label class="cap">Max Response Length <small>— tokens</small></label>
    <input id="ed_maxr" type="number" min="128" step="128">
    <div style="opacity:.45;pointer-events:none">
      <input placeholder="Multiple swipes per generation" disabled>
      <label class="cb"><input type="checkbox" disabled> Streaming</label>
      <input placeholder="Temperature" disabled>
      <input placeholder="Frequency Penalty" disabled>
      <input placeholder="Presence Penalty" disabled>
      <input placeholder="Top P" disabled>
      <input placeholder="Top K" disabled>
      <input placeholder="Min P" disabled>
      <input placeholder="Repetition penalty" disabled>
      <input placeholder="Seed (-1 = random)" disabled>
      <input placeholder="Character Names Behavior" disabled>
      <input placeholder="Continue Postfix" disabled>
      <label class="cb"><input type="checkbox" disabled> Continue prefill</label>
      <label class="cb"><input type="checkbox" disabled> Squash system messages</label>
      <label class="cb"><input type="checkbox" disabled> Enable function calling</label>
      <input placeholder="Tool Call Recurse Limit" disabled>
      <label class="cb"><input type="checkbox" disabled> Interleaved Thinking</label>
      <label class="cb"><input type="checkbox" disabled> Send inline media</label>
      <input placeholder="Inline Image Quality" disabled>
      <label class="cb"><input type="checkbox" disabled> Request model reasoning</label>
      <input placeholder="Reasoning Effort (auto/min/max)" disabled>
      <input placeholder="Verbosity" disabled>
      <input placeholder="Logit Bias" disabled>
      <input placeholder="Instruct template" disabled>
      <input placeholder="Custom request body (JSON)" disabled>
    </div>
    <button onclick="saveProf()">Save</button>
    <button onclick="clearEd()" style="background:#444">Clear</button>
  </div>
  <small>Generation uses the <b>active</b> profile. Keys are stored server-side and never reach other clients.</small>
</main>
</div>
<script src="layout.js"></script>
<script>
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.mp_token||'')});
const api=(p,b)=>fetch(`/api/${p}`,{method:'POST',headers:H(),body:JSON.stringify(b||{})}).then(r=>r.json());
const get=p=>fetch(`/api/${p}`,{headers:H()}).then(r=>r.json());
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let allProfs=[];
async function load(){
  const {profiles}=await get('profiles');allProfs=profiles||[];
  $('list').innerHTML=allProfs.map((p,i)=>`
    <div class="prof${p.active?' on':''}" style="cursor:pointer" onclick="editIdx(${i})">
      <div>
        <div class="name">${esc(p.name)}${p.active?'<span class="badge">active</span>':''}</div>
        <div class="url">${esc(p.api_url)}</div>
        <div class="meta">${esc(p.model)} · ${p.has_key?'key set':'no key'}</div>
      </div>
      <div class="btns" onclick="event.stopPropagation()">
        ${p.active?'':`<button class="act" onclick="activate(${p.id})">Make active</button>`}
        <button class="del" onclick="del(${p.id})">Delete</button>
      </div>
    </div>`).join('')||'<small>No profiles yet.</small>';
}

function editIdx(i){edit(allProfs[i])}
function edit(p){document.querySelectorAll('.prof').forEach(el=>el.classList.remove('sel'));event?.target?.closest?.('.prof')?.classList.add('sel');
  $('edtitle').textContent='Edit '+p.name;$('ed_id').value=p.id;$('ed_name').value=p.name;$('ed_url').value=p.api_url;$('ed_model').value=p.model;$('ed_key').value='';$('ed_headers').value=p.headers&&p.headers!=='{}'?p.headers:'';$('ed_ctx').value=p.context_size||0;$('ed_maxr').value=p.max_response||2048;mpOpenEditor('inline')}
async function fetchModels(){
  const r=await api('models',{profileId:$('ed_id').value?Number($('ed_id').value):null,
    apiUrl:$('ed_url').value.trim(),key:$('ed_key').value.trim(),headers:$('ed_headers').value.trim()||'{}'});
  if(r.error)return alert(r.error);
  $('modelist').innerHTML=(r.models||[]).map(m=>`<option value="${m}">`).join('');
  $('ed_model').focus();
}
function clearEd(){$('editor').style.display='none';$('edtitle').textContent='New profile';$('ed_id').value='';$('ed_name').value='';$('ed_url').value='';$('ed_model').value='';$('ed_key').value='';$('ed_headers').value='';$('ed_ctx').value='';$('ed_maxr').value=''}
function newProf(){clearEd();mpOpenEditor('inline');$('ed_name').focus()}

async function saveProf(){
  const id=$('ed_id').value;
  const b={name:$('ed_name').value.trim(),apiUrl:$('ed_url').value.trim(),model:$('ed_model').value.trim(),key:$('ed_key').value.trim(),headers:$('ed_headers').value.trim()||'{}',contextSize:Number($('ed_ctx').value)||0,maxResponse:Number($('ed_maxr').value)||2048};
  if(b.headers!=='{}'){
    try{JSON.parse(b.headers)}
    catch{
      // Accept "name: value" lines and convert to JSON
      const h={};
      for(const line of b.headers.split(/[\n,]+/)){const i=line.indexOf(':');if(i<1)return alert('Headers must be JSON or "name: value" lines');h[line.slice(0,i).trim()]=line.slice(i+1).trim();}
      b.headers=JSON.stringify(h);
    }
  }
  if(!b.name)return alert('needs a name');
  if(id)await api('profiles/update',{id:Number(id),...b});
  else await api('profiles',b);
  clearEd();load();
}
async function activate(id){await api('profiles/activate',{id});load()}
async function del(id){if(confirm('Delete this profile?')){await api('profiles/delete',{id});load()}}
load().then(newProf);
</script>
</body>
</html>
