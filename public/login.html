<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>BOLLOCKS · Login</title>
<style>
body{margin:0;background:#0d0e10;color:#ddd;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{width:300px;padding:28px;border:1px solid #2b3a5e;border-radius:8px;background:#191b24}
h1{font-size:1.3em;font-weight:700;text-align:center;margin:0 0 18px}
label{display:block;font-size:.78em;color:#789;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 3px}
input{width:100%;padding:10px;background:#2a2b2e;border:1px solid #444;color:#ddd;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:10px;background:#3a5ccc;border:none;color:#fff;border-radius:6px;cursor:pointer;margin-top:16px}
.err{color:#c66;text-align:center;font-size:.85em;min-height:1.2em;margin-top:8px}
</style>
</head>
<body>
<form class="box" onsubmit="go(event)">
  <h1>Sign in</h1>
  <label>Username</label>
  <input id="handle" autocomplete="username" autofocus>
  <label>Password</label>
  <input type="password" id="pw" autocomplete="current-password">
  <button type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
async function go(e) {
    e.preventDefault();
    const r = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            handle: document.getElementById('handle').value.trim(),
            password: document.getElementById('pw').value,
        }),
    }).then(r => r.json());
    if (r.error) return document.getElementById('err').textContent = r.error;
    localStorage.mp_token = r.token;
    location = '/';
}
</script>
</body>
</html>
