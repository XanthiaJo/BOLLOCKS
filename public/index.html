<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>RP · Chat</title>
<link rel="stylesheet" href="layout.css">
<style>
#chat{display:flex;flex-direction:column;min-height:0;flex:1}
#msgs{list-style:none;padding:8px 16px;margin:0;flex:1;overflow-y:auto}
.mes{padding:7px 4px;border-bottom:1px solid #232426}
.mes .n{font-weight:600;color:#9ab;margin-right:6px}
.mes .t{white-space:pre-wrap;margin-top:2px}
.mes .t i{color:#b8c9e8}
.mes .t h2,.mes .t h3,.mes .t h4,.mes .t h5{margin:.3em 0}
.mes .t code{background:#232426;padding:1px 5px;border-radius:3px;font-size:.92em}
.mes.ai .n{color:#7ac}
.mes.sys .t{color:#789;font-style:italic}
#composer{padding:10px 16px;display:flex;gap:8px;border-top:1px solid #2a2b2e;flex:none}
#composer input{flex:1;margin:0}
#composer button{width:auto;margin:0;white-space:nowrap}
button.gen{background:#4a7c3a}
.room{padding:7px 8px;border-radius:5px;cursor:pointer;margin-bottom:3px}
.room:hover{background:#232426}
.room.on{background:#2b3a5e}
.room .n{font-weight:600}
.member{padding:4px 8px;font-size:.9em;color:#abc;display:flex;align-items:center;gap:6px}
.member .fgen{margin:0;margin-left:auto;width:22px;height:22px;padding:0;font-size:11px;line-height:22px;text-align:center;flex:none;background:#4a7c3a;border:none;border-radius:4px;cursor:pointer;color:#fff}
.member .fgen:disabled{opacity:.4;cursor:default}
#sidebar input{width:100%}
#sidebar button:not(.fgen){width:100%}
</style>
</head>
<body>
<aside id="sidebar">
  <h3>Chats</h3>
  <div id="rooms"></div>
  <input id="newroom" placeholder="New chat name">
  <button onclick="newRoom()">+ Chat</button>
</aside>
<aside id="rsidebar">
  <h3>In this chat</h3>
  <div id="members"></div>
  <h3 style="margin-top:16px">Chat settings</h3>
  World<br><select id="worldsel" onchange="setWorld(this.value)" style="width:100%"></select>
</aside>

<div id="content">
  <div id="chat">
    <ul id="msgs"></ul>
    <div id="composer">
      <input id="in" placeholder="Type a message" autofocus onkeydown="if(event.key==='Enter')say()">
      <button onclick="say()">Send</button>
      <button class="gen" onclick="gen()">NPC ▸</button>
    </div>
  </div>
</div>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
