<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>RP · Chat</title>
<link rel="stylesheet" href="layout.css">
<style>
#chat{display:flex;flex-direction:column;min-height:0;flex:1}
#msgs{list-style:none;padding:8px 16px;margin:0;flex:1;overflow-y:auto}
.mes{padding:7px 4px;border-bottom:1px solid #232426}
.mes .n{font-weight:600;color:#9ab;margin-right:6px}
.mes .t{white-space:pre-wrap;margin-top:2px}
.mes .t i{color:#b8c9e8}
.mes .t h2,.mes .t h3,.mes .t h4,.mes .t h5{margin:.3em 0}
.mes .t code{background:#232426;padding:1px 5px;border-radius:3px;font-size:.92em}
.mes.ai .n{color:#7ac}
.mes.sys .t{color:#789;font-style:italic}
#composer{padding:10px 16px;display:flex;gap:8px;border-top:1px solid #2a2b2e;flex:none}
#composer input{flex:1;margin:0}
#composer button{width:auto;margin:0;white-space:nowrap}
button.gen{background:#4a7c3a}
.room{padding:7px 8px;border-radius:5px;cursor:pointer;margin-bottom:3px}
.room:hover{background:#232426}
.room.on{background:#2b3a5e}
.room .n{font-weight:600}
.member{padding:4px 8px;font-size:.9em;color:#abc;display:flex;align-items:center;gap:6px}
.member .fgen{margin:0;width:22px;height:22px;padding:0;font-size:10px;line-height:20px;text-align:center;flex:none;background:transparent;border:1px solid #3a4a3e;border-radius:4px;cursor:pointer;color:#6a8a6e}
.member .fgen:hover{background:#4a7c3a;color:#fff;border-color:#4a7c3a}
.member .fgen:disabled{opacity:.3;cursor:default}
.talk{display:flex;align-items:center;gap:6px;padding:0 8px 6px 20px;font-size:.7em;color:#567}
.talk input[type=range]{appearance:none;-webkit-appearance:none;flex:1;margin:0;padding:0;height:4px;background:#333;border:none;border-radius:2px}
.talk input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#4a7c3a;cursor:pointer}
.talk input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#4a7c3a;border:none;cursor:pointer}
.talk input[type=range]::-moz-range-track{background:#333;height:4px;border-radius:2px}
.talk .tv{width:32px;text-align:right;color:#789}
#sidebar input{width:100%}
#sidebar button:not(.fgen){width:100%}
</style>
</head>
<body>
<aside id="sidebar">
  <h3>Chats</h3>
  <div id="rooms"></div>
  <input id="newroom" placeholder="New chat name">
  <button onclick="newRoom()">+ Chat</button>
</aside>
<aside id="rsidebar">
  <h3>In this chat</h3>
  <div id="members"></div>
  <h3 style="margin-top:16px">AI trigger</h3>
  <select id="trigsel" onchange="setTrig(this.value)" style="width:100%">
    <option value="manual">Manual only</option>
    <option value="all">Reply to every message</option>
    <option value="named">Only when named</option>
    <option value="roundrobin">Round-robin</option>
  </select>
  <h3 style="margin-top:16px">Chat settings</h3>
  World<br><select id="worldsel" onchange="setWorld(this.value)" style="width:100%"></select>
  <h3 style="margin-top:16px">Prompt use</h3>
  <div id="toks"><small>generate to see</small></div>
</aside>

<div id="content">
  <div id="chat">
    <ul id="msgs"></ul>
    <div id="composer">
      <input id="in" placeholder="Type a message" autofocus onkeydown="if(event.key==='Enter')say()">
      <button onclick="say()">Send</button>
      <button class="gen" onclick="gen()">NPC ▸</button>
    </div>
  </div>
</div>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
