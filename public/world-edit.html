<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>RP · World editor</title>
<link rel="stylesheet" href="layout.css">
<style>
.ent.off{opacity:.5}
.ent .keys{color:#7ac;font-size:.85em;font-weight:600}
.ent .comment{color:#dab;font-size:.85em;font-weight:600}
.back{color:#9ab;text-decoration:none;font-size:.9em}
.back:hover{color:#fff}
textarea{min-height:80px;font-family:inherit}
</style>
</head>
<body>
<aside id="rsidebar">
  <h3>Entries</h3>
  <div id="list"></div>
</aside>
<div id="content">
<main>
  <a class="back" href="/world.html">← Books</a>
  <h2 id="bookname" style="margin:8px 0 14px"></h2>
  <div class="panel" id="editor" style="display:none">
    <h3 id="edtitle">New entry</h3>
    <input type="hidden" id="ed_id">
    <input id="ed_comment" placeholder="Title / comment (for your reference)">
    <input id="ed_keys" placeholder="Keywords — comma separated (any match triggers)">
    <input id="ed_keys2" placeholder="Secondary keywords — ALL must also match">
    <textarea id="ed_content" placeholder="Content — lore, location details, rules"></textarea>
    <label class="cb"><input type="checkbox" id="ed_const"> Always active (no keyword needed)</label>
    <label class="cb"><input type="checkbox" id="ed_enabled" checked> Enabled</label>
    <input id="ed_ord" type="number" placeholder="Order (0 = first)" value="0">
    <button onclick="saveEnt()">Save</button>
    <button onclick="document.getElementById('editor').style.display='none'" style="background:#444">Close</button>
  </div>
  <button onclick="newEntry()" style="margin-bottom:12px">+ New entry</button>
</main>
</div>
<script src="layout.js"></script>
<script>
const AS=new URLSearchParams(location.search).get('as')||'';
const H=()=>({'Content-Type':'application/json',...(AS?{'X-As-User':AS}:{})});
const api=(p,b)=>fetch(`/api/${p}`,{method:'POST',headers:H(),body:JSON.stringify(b||{})}).then(r=>r.json());
const get=p=>fetch(`/api/${p}`,{headers:H()}).then(r=>r.json());
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BOOK=Number(new URLSearchParams(location.search).get('id')||0);
const ROOM=Number(localStorage.mp_room||1);

async function load(){
  const [{entries},{books}]=await Promise.all([get('world?book='+BOOK),get('world/books')]);
  const b=(books||[]).find(b=>b.id===BOOK);
  $('bookname').textContent=b?.name||('Book #'+BOOK);
  $('list').innerHTML=(entries||[]).map(e=>`
    <div class="card ent${e.enabled?'':' off'}">
      <div>
        ${e.comment?`<div class="comment">${esc(e.comment)}</div>`:''}
        <div class="keys">${e.constant?'⚡ always':esc(JSON.parse(e.keys||'[]').join(', ')||'(no keys)')}${JSON.parse(e.keysecondary||'[]').length?' + '+esc(JSON.parse(e.keysecondary||'[]').join(', ')):''}</div>
        <div class="desc">${esc(e.content)}</div>
        <div class="meta">#${e.id} · order ${e.ord}</div>
      </div>
      <div class="btns">
        <button onclick='edit(${JSON.stringify(e).replace(/'/g,"&#39;")})'>Edit</button>
        <button onclick="toggle(${e.id},${e.enabled?0:1})">${e.enabled?'Disable':'Enable'}</button>
        <button class="del" onclick="del(${e.id})">Delete</button>
      </div>
    </div>`).join('')||'<small>No entries yet.</small>';
}
function newEntry(){clearEd();$('editor').style.display='block'}
function edit(e){$('edtitle').textContent='Edit entry #'+e.id;$('ed_id').value=e.id;$('ed_comment').value=e.comment||'';$('ed_keys').value=JSON.parse(e.keys||'[]').join(', ');$('ed_keys2').value=JSON.parse(e.keysecondary||'[]').join(', ');$('ed_content').value=e.content;$('ed_const').checked=!!e.constant;$('ed_enabled').checked=!!e.enabled;$('ed_ord').value=e.ord;$('editor').style.display='block';scrollTo(0,0)}
function clearEd(){$('edtitle').textContent='New entry';['ed_id','ed_comment','ed_keys','ed_keys2','ed_content'].forEach(i=>$(i).value='');$('ed_const').checked=false;$('ed_enabled').checked=true;$('ed_ord').value=0}

async function saveEnt(){
  const id=$('ed_id').value;
  const b={room:ROOM,book:BOOK,comment:$('ed_comment').value.trim(),keys:$('ed_keys').value,keysecondary:$('ed_keys2').value,content:$('ed_content').value,constant:$('ed_const').checked,enabled:$('ed_enabled').checked,ord:Number($('ed_ord').value)||0};
  if(!b.content.trim())return alert('needs content');
  if(id)await api('world/update',{id:Number(id),...b});
  else await api('world',b);
  $('editor').style.display='none';load();
}
async function toggle(id,en){await api('world/update',{id,enabled:!!en});load()}
async function del(id){if(confirm('Delete this entry?')){await api('world/delete',{id});load()}}
load();
</script>
</body>
</html>
