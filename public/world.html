<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>BOLLOCKS · World</title>
<link rel="stylesheet" href="layout.css">
</head>
<body>
<aside id="rsidebar">
  <h3>Books</h3>
  <div id="list"></div>
  <button onclick="newBookPanel()">+ New book</button>
</aside>
<div id="content">
<main>
  <div class="panel" id="editor" style="display:none">
    <h3>New book</h3>
    <input id="newname" placeholder="Book name">
    <button onclick="newBook()">Create</button>
    <button class="imp" onclick="document.getElementById('imp').click()">Import ST book…</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importBook(this)">
  </div>
</main>
</div>
<script src="layout.js"></script>
<script>
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.mp_token||'')});
const api=(p,b)=>fetch(`/api/${p}`,{method:'POST',headers:H(),body:JSON.stringify(b||{})}).then(r=>r.status===401?location='/login.html':r.json());
const get=p=>fetch(`/api/${p}`,{headers:H()}).then(r=>r.status===401?location='/login.html':r.json());
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROOM=Number(localStorage.mp_room||1);
let me='';

async function load(){
  const [{books,rooms},who]=await Promise.all([get('world/books'),get('me')]);
  me=who.handle;
  const room=rooms.find(r=>r.id===ROOM);
  $('list').innerHTML=(books||[]).map(b=>{
    const usedIn=rooms.filter(r=>r.world_books_id_fk===b.id).map(r=>r.name);
    const mine=!b.owner||b.owner===me;
    return rprofRow({name:esc(b.name),
      meta:`${b.cnt||0} entries · ${esc(b.owner||'shared')}${usedIn.length?' · in: '+esc(usedIn.join(', ')):''}` +
        `${mine?` <a href="#" onclick="event.stopPropagation();delBook(${b.id});return false" style="color:var(--err)">✕</a>`:''}`,
      onclick:`location='/world-edit.html?id=${b.id}'`});
  }).join('')||'<small>No books yet — create one above or import an ST export.</small>';
}

function newBookPanel(){mpOpenEditor('inline');$('newname').focus()}
async function newBook(){
  const name=$('newname').value.trim();if(!name)return;
  $('newname').value='';
  const r=await api('world/books',{name});
  if(r.id)location='/world-edit.html?id='+r.id;
}
async function delBook(id){if(confirm('Delete this book and all its entries?')){await api('world/books/delete',{id});load()}}
async function importBook(input){
  const f=input.files[0];input.value='';if(!f)return;
  const r=await api('world/import',{book:await f.text(),name:f.name.replace(/\.json$/,'')});
  if(r.error)return alert(r.error);
  location='/world-edit.html?id='+r.id;
}
load();
</script>
</body>
</html>
