<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>RP · World</title>
<link rel="stylesheet" href="layout.css">
</head>
<body>
<aside id="rsidebar">
  <h3>Books</h3>
  <div id="list"></div>
</aside>
<div id="content">
<main>
  <div class="panel">
    <h3>New book</h3>
    <input id="newname" placeholder="Book name">
    <button onclick="newBook()">Create</button>
    <button onclick="document.getElementById('imp').click()" style="background:#5a4a7c">Import ST book…</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importBook(this)">
  </div>
</main>
</div>
<script src="layout.js"></script>
<script>
const AS=new URLSearchParams(location.search).get('as')||'';
const H=()=>({'Content-Type':'application/json',...(AS?{'X-As-User':AS}:{})});
const api=(p,b)=>fetch(`/api/${p}`,{method:'POST',headers:H(),body:JSON.stringify(b||{})}).then(r=>r.json());
const get=p=>fetch(`/api/${p}`,{headers:H()}).then(r=>r.json());
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROOM=Number(localStorage.mp_room||1);
let me='';

async function load(){
  const [{books,rooms},who]=await Promise.all([get('world/books'),get('me')]);
  me=who.handle;
  const room=rooms.find(r=>r.id===ROOM);
  $('list').innerHTML=(books||[]).map(b=>{
    const usedIn=rooms.filter(r=>r.world_book_id===b.id).map(r=>r.name);
    const mine=!b.owner||b.owner===me;
    return `
    <div class="card">
      <div>
        <div class="name">${esc(b.name)}</div>
        <div class="meta">#${b.id} · ${b.cnt||0} entries · ${esc(b.owner||'shared')}${usedIn.length?' · in: '+esc(usedIn.join(', ')):''}</div>
      </div>
      <div class="btns">
        <button onclick="location='/world-edit.html?id=${b.id}${AS?'&as='+AS:''}'">Open</button>
        ${mine?`<button class="del" onclick="delBook(${b.id})">Delete</button>`:''}
      </div>
    </div>`;
  }).join('')||'<small>No books yet — create one above or import an ST export.</small>';
}

async function newBook(){
  const name=$('newname').value.trim();if(!name)return;
  $('newname').value='';
  const r=await api('world/books',{name});
  if(r.id)location='/world-edit.html?id='+r.id+(AS?'&as='+AS:'');
}
async function delBook(id){if(confirm('Delete this book and all its entries?')){await api('world/books/delete',{id});load()}}
async function importBook(input){
  const f=input.files[0];input.value='';if(!f)return;
  const r=await api('world/import',{room:ROOM,book:await f.text(),name:f.name.replace(/\.json$/,'')});
  if(r.error)return alert(r.error);
  location='/world-edit.html?id='+r.id+(AS?'&as='+AS:'');
}
load();
</script>
</body>
</html>
