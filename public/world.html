<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>RP · World</title>
<link rel="stylesheet" href="layout.css">
<style>
#content{padding:0}
main{max-width:860px;margin:24px auto;padding:0 16px;overflow-y:auto}
.ent{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border:1px solid #2a2b2e;border-radius:6px;margin-bottom:10px;background:#141517}
.ent.off{opacity:.5}
.ent .keys{color:#7ac;font-size:.85em;font-weight:600}
.ent .txt{color:#abc;font-size:.9em;white-space:pre-wrap;margin-top:4px}
.ent .meta{color:#567;font-size:.8em;margin-top:4px}
.ent .btns{display:flex;flex-direction:column;gap:6px}
.ent button{width:auto}
button.del{background:#7c3a3a}
textarea{min-height:90px;font-family:inherit;width:100%}
#editor{border:1px solid #2b3a5e;border-radius:6px;padding:14px;margin-bottom:18px;background:#191b24}
#editor h3{margin-top:0}
#editor input{width:100%}
label.cb{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:.9em}
label.cb input{width:auto;margin:0}
</style>
</head>
<body>
<div id="content">
<main>
  <div id="editor">
    <h3 id="edtitle">New world entry</h3>
    <input type="hidden" id="ed_id">
    <input id="ed_keys" placeholder="Keywords — comma separated (triggers injection)">
    <textarea id="ed_content" placeholder="Content — lore, location details, rules of the world"></textarea>
    <label class="cb"><input type="checkbox" id="ed_const"> Always active (no keyword needed)</label>
    <label class="cb"><input type="checkbox" id="ed_enabled" checked> Enabled</label>
    <input id="ed_ord" type="number" placeholder="Order (0 = first)" value="0">
    <button onclick="saveEnt()">Save</button>
    <button onclick="clearEd()" style="background:#444">Clear</button>
  </div>
  <div id="list"></div>
  <small>Entries inject into generation when a keyword appears in recent messages — or always if "always active". Scoped to this chat.</small>
</main>
</div>
<script src="layout.js"></script>
<script>
const AS=new URLSearchParams(location.search).get('as')||'';
const H=()=>({'Content-Type':'application/json',...(AS?{'X-As-User':AS}:{})});
const api=(p,b)=>fetch(`/api/${p}`,{method:'POST',headers:H(),body:JSON.stringify(b||{})}).then(r=>r.json());
const get=p=>fetch(`/api/${p}`,{headers:H()}).then(r=>r.json());
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROOM=Number(localStorage.mp_room||1);

async function load(){
  const {entries}=await get('world?room='+ROOM);
  $('list').innerHTML=(entries||[]).map(e=>`
    <div class="ent${e.enabled?'':' off'}">
      <div>
        <div class="keys">${e.constant?'⚡ always':esc(JSON.parse(e.keys||'[]').join(', ')||'(no keys)')}</div>
        <div class="txt">${esc(e.content)}</div>
        <div class="meta">#${e.id} · order ${e.ord}</div>
      </div>
      <div class="btns">
        <button onclick='edit(${JSON.stringify(e).replace(/'/g,"&#39;")})'>Edit</button>
        <button onclick="toggle(${e.id},${e.enabled?0:1})">${e.enabled?'Disable':'Enable'}</button>
        <button class="del" onclick="del(${e.id})">Delete</button>
      </div>
    </div>`).join('')||'<small>No world entries yet.</small>';
}

function edit(e){$('edtitle').textContent='Edit entry #'+e.id;$('ed_id').value=e.id;$('ed_keys').value=JSON.parse(e.keys||'[]').join(', ');$('ed_content').value=e.content;$('ed_const').checked=!!e.constant;$('ed_enabled').checked=!!e.enabled;$('ed_ord').value=e.ord;scrollTo(0,0)}
function clearEd(){$('edtitle').textContent='New world entry';$('ed_id').value='';$('ed_keys').value='';$('ed_content').value='';$('ed_const').checked=false;$('ed_enabled').checked=true;$('ed_ord').value=0}

async function saveEnt(){
  const id=$('ed_id').value;
  const b={room:ROOM,keys:$('ed_keys').value,content:$('ed_content').value,constant:$('ed_const').checked,enabled:$('ed_enabled').checked,ord:Number($('ed_ord').value)||0};
  if(!b.content.trim())return alert('needs content');
  if(id)await api('world/update',{id:Number(id),...b});
  else await api('world',b);
  clearEd();load();
}
async function toggle(id,en){await api('world/update',{id,enabled:!!en});load()}
async function del(id){if(confirm('Delete this entry?')){await api('world/delete',{id});load()}}
load();
</script>
</body>
</html>
