<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>RP · Memories</title>
<link rel="stylesheet" href="layout.css">
<style>
.mtag{display:inline-block;font-size:.7em;font-weight:700;padding:1px 6px;border-radius:3px;background:#3a3f4a;color:#9ab;margin-right:4px}
.mtag.mevent{background:#3a4a3e;color:#9c9}
.mtag.mrelationship{background:#4a3a5e;color:#c9c}
.mtag.mpreference{background:#5e4a3a;color:#dc9}
.tabs{display:flex;gap:6px;margin:8px 0}
.tab{background:#2a2b2e;border:1px solid #3a3b3e;color:#9ab;padding:5px 14px;border-radius:4px;cursor:pointer;width:auto;font-size:.85em}
.tab.on{background:#3a5ccc;color:#fff;border-color:#3a5ccc}
</style>
</head>
<body>
<aside id="rsidebar">
  <h3 style="margin-top:0">Chat</h3>
  <div id="rchat"></div>
  <h3 style="margin-top:14px">Characters</h3>
  <div id="rcards"></div>
</aside>
<div id="content">
<main>
  <div class="panel">
    <h3 id="title">Memories</h3>
    <div class="tabs">
      <button class="tab" id="t_perm" onclick="tab('manual')">Permanent</button>
      <button class="tab" id="t_auto" onclick="tab('auto')">Smart</button>
      <button class="tab" id="t_set" onclick="tab('settings')">Settings</button>
    </div>
    <div id="addbox">
      <textarea id="newmem" placeholder="e.g. Fig hates the colour green" style="min-height:60px;width:100%"></textarea>
      <button onclick="add()">Add memory</button>
    </div>
  </div>
  <div id="list"></div>
  <div class="panel" id="setpanel">
    <h3>Memory settings</h3>
    <label class="cb"><input type="checkbox" id="set_auto" onchange="saveSet()"> Enable Smart Memory</label>
    <h4 style="margin:12px 0 4px;color:#789">Extraction</h4>
    <div style="font-size:.8em;color:#789">Extract after every</div>
    <input type="number" id="set_every" min="2" max="100" onchange="saveSet()" style="width:80px;display:inline-block"> <span style="font-size:.8em;color:#789">new messages</span>
    <h4 style="margin:12px 0 4px;color:#789">Injection</h4>
    <div style="font-size:.8em;color:#789">Injection token budget</div>
    <input type="number" id="set_budget" min="50" max="4000" onchange="saveSet()" style="width:80px;display:inline-block">
    <div style="opacity:.45;pointer-events:none;margin-top:8px">
      <div style="font-size:.8em;color:#789">Injection position</div>
      <label class="cb"><input type="radio" name="pos" checked disabled> Before main prompt</label>
      <label class="cb"><input type="radio" name="pos" disabled> In-chat @ depth</label>
      <label class="cb"><input type="checkbox" disabled> Read-only mode</label>
      <div style="font-size:.8em;color:#789">Max stored memories per character</div>
      <input type="number" value="50" disabled style="width:80px">
    </div>
  </div>
</main>
</div>
<script src="layout.js"></script>
<script>
const AS=new URLSearchParams(location.search).get('as')||'';
const H=()=>({'Content-Type':'application/json',...(AS?{'X-As-User':AS}:{})});
const api=(p,b)=>fetch(`/api/${p}`,{method:'POST',headers:H(),body:JSON.stringify(b||{})}).then(r=>r.json());
const get=p=>fetch(`/api/${p}`,{headers:H()}).then(r=>r.json());
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ROOM=Number(localStorage.mp_room||1);
let cardId=0,cardName='',curTab='manual',allMems=[];
function tab(t){curTab=t;
  $('t_perm').classList.toggle('on',t==='manual');
  $('t_auto').classList.toggle('on',t==='auto');
  $('t_set').classList.toggle('on',t==='settings');
  renderList();
}
function renderList(){
  const mems=allMems.filter(m=>(m.source||'manual')===curTab);
  $('addbox').style.display=curTab==='manual'?'block':'none';
  $('setpanel').style.display=curTab==='settings'?'block':'none';
  $('list').innerHTML=curTab==='settings'?'':
    mems.map(m=>`
    <div class="card">
      <div><div class="desc"><span class="mtag m${esc(m.type||'fact')}">${esc(m.type||'fact')}</span> ${esc(m.content)}</div><div class="meta">#${m.id} · ${m.created||''}</div></div>
      <div class="btns"><button class="del" onclick="del(${m.id})">Delete</button></div>
    </div>`).join('')||`<small>No ${curTab==='auto'?'smart':'permanent'} memories yet.</small>`;
}

let roomName='';
async function load(){
  const [{cards},{rooms}]=await Promise.all([get('cards'),get('rooms')]);
  const rm=(rooms||[]).find(r=>r.id===ROOM);
  roomName=rm?.name||'Chat';
  $('set_auto').checked=!!rm?.auto_mem;$('set_every').value=rm?.mem_every||10;$('set_budget').value=rm?.mem_budget||500;
  $('rchat').innerHTML=
    `<div class="rprof${cardId===0?' on':''}" onclick="pick(0,'${esc(roomName)}')"><div class="n">${esc(roomName)}</div><div class="m">shared memories</div></div>`;
  $('rcards').innerHTML=(cards||[]).map(c=>
      `<div class="rprof${c.id===cardId?' on':''}" onclick="pick(${c.id},'${esc(c.name).replace(/'/g,"\\'")}')"><div class="n">${esc(c.name)}</div></div>`
    ).join('')||'<small>None</small>';
  if(cardId<0)cardId=0;
  const {memories}=await get(`memories?card=${cardId}&room=${ROOM}`);
  allMems=memories||[];
  $('title').textContent=`${cardName||roomName||'Memories'} — memories`;
  renderList();
}
function pick(id,name){cardId=id;cardName=name;load()}
async function add(){const t=$('newmem').value.trim();if(!t)return;$('newmem').value='';await api('memories',{cardId,room:ROOM,content:t});load()}
async function del(id){if(confirm('Forget this memory?')){await api('memories/delete',{id});load()}}
async function saveSet(){await api('room/memsettings',{room:ROOM,auto:$('set_auto').checked,every:Number($('set_every').value)||10,budget:Number($('set_budget').value)||500})}
load();
</script>
</body>
</html>
