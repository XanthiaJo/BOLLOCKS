<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>BOLLOCKS · Characters</title>
<link rel="stylesheet" href="layout.css">
<style>
#content{max-width:none;padding:0}
main{max-width:860px;margin:24px auto;padding:0 16px;overflow-y:auto}
textarea{min-height:90px;font-family:inherit;width:100%}
.card{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:12px;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:var(--surface)}
.card img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--surface2)}
.card .name{font-weight:700}
.card .desc{color:var(--desc);font-size:.9em;white-space:pre-wrap;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{color:var(--faint);font-size:.8em;margin-top:4px}
.card .btns{display:flex;flex-direction:column;gap:6px}
.card button{width:auto}
#editor{display:none;border:1px solid var(--edge);border-radius:6px;padding:14px;background:var(--panel);margin-bottom:14px}
#editor h3{margin-top:0}
#editor input{width:100%}
</style>
</head>
<body>
<aside id="rsidebar"></aside>
<div id="cropmodal" style="display:none;position:fixed;inset:0;background:var(--veil-deep);z-index:100;align-items:center;justify-content:center">
  <div style="background:var(--panel);padding:16px;border-radius:10px;text-align:center">
    <div class="cap" style="margin:0 0 8px">Drag to crop — confirm keeps the square</div>
    <div id="cropwrap" style="position:relative;display:inline-block">
      <img id="cropimg" draggable="false">
      <div id="cropbox" style="position:absolute;border:2px solid var(--ok);background:var(--ok-tint);cursor:move"></div>
    </div>
    <div style="margin-top:10px">
      <label class="cap" style="display:inline-block;margin-right:8px">Size</label>
      <input type="range" id="cropsize" min="30" max="100" value="90" style="width:160px;vertical-align:middle" oninput="cropResize(this.value)">
      <button onclick="cropConfirm()">Use crop</button>
      <button class="sec" onclick="$('cropmodal').style.display='none'">Cancel</button>
    </div>
  </div>
</div>
<div id="content">
<main>
  <div id="editor">
    <h3 id="edtitle">New character</h3>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <img id="ed_av" src="" onload="this.style.visibility='visible'" onerror="this.style.visibility='hidden'" style="width:140px;height:140px;object-fit:cover;border-radius:10px;background:var(--surface2);cursor:pointer" title="Change picture" onclick="$('avpick').click()">
      <div><div class="cap" style="margin-top:0">Picture</div>
      <button onclick="$('avpick').click()" style="padding:6px 12px">Choose image</button>
      <input type="file" id="avpick" accept="image/*" style="display:none" onchange="pickAvatar(this)"></div>
    </div>
    <input type="hidden" id="ed_id">
    <label class="cap">Name</label>
    <input id="ed_name">
    <label class="cap">Description</label>
    <textarea id="ed_desc" style="min-height:140px"></textarea>
    <label class="cap">Personality</label>
    <textarea id="ed_personality" style="min-height:100px"></textarea>
    <label class="cap">Scenario</label>
    <textarea id="ed_scenario" style="min-height:70px"></textarea>
    <label class="cap">First message (greeting)</label>
    <textarea id="ed_first" style="min-height:120px"></textarea>
    <label class="cap">Example dialogue</label>
    <textarea id="ed_mesex" style="min-height:120px"></textarea>
    <label class="cap">System prompt override <small>— optional</small></label>
    <textarea id="ed_sysp" style="min-height:60px"></textarea>
    <label class="cap">Post-history instructions <small>— optional</small></label>
    <textarea id="ed_phi" style="min-height:60px"></textarea>
    <label class="cap">Tags <small>— comma separated</small></label>
    <input id="ed_tags">
    <input type="hidden" id="ed_creator">
    <label class="cap">API profile <small>— uses default unless changed</small></label>
    <select id="ed_profile" style="width:100%;padding:8px;background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:4px"></select>
    <div style="margin-top:18px">
    <button onclick="saveCard()">Save</button>
    <button class="sec" onclick="clearEd()">Clear</button>
    <button class="imp" onclick="document.getElementById('imp').click()">Import card…</button>
    <input type="file" id="imp" accept=".png,.json" style="display:none" onchange="importCard(this)">
    </div>
  </div>
</main>
</div>
<script src="layout.js"></script>
<script src="characters.js"></script>
</body>
</html>
