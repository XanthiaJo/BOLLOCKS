<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>RP · Characters</title>
<link rel="stylesheet" href="layout.css">
<style>
#content{max-width:none;padding:0}
main{max-width:860px;margin:24px auto;padding:0 16px;overflow-y:auto}
textarea{min-height:90px;font-family:inherit;width:100%}
.card{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:12px;border:1px solid #2a2b2e;border-radius:6px;margin-bottom:10px;background:#141517}
.card img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#232426}
.cap{display:block;font-size:.78em;color:#789;margin:10px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.cap small{text-transform:none;color:#567}
.card .name{font-weight:700}
.card .desc{color:#abc;font-size:.9em;white-space:pre-wrap;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{color:#567;font-size:.8em;margin-top:4px}
.card .btns{display:flex;flex-direction:column;gap:6px}
.card button{width:auto}
button.del{background:#7c3a3a}
#editor{border:1px solid #2b3a5e;border-radius:6px;padding:14px;margin-bottom:18px;background:#191b24}
#editor h3{margin-top:0}
#editor input{width:100%}
</style>
</head>
<body>
<aside id="rsidebar">
  <h3>Characters</h3>
  <div id="list"></div>
</aside>
<div id="content">
<main>
  <div id="editor">
    <h3 id="edtitle">New character</h3>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <img id="ed_av" src="" onerror="this.style.visibility='hidden'" style="width:72px;height:72px;object-fit:cover;border-radius:8px;background:#232426;cursor:pointer" title="Change picture" onclick="$('avpick').click()">
      <div><div class="cap" style="margin-top:0">Picture</div>
      <button onclick="$('avpick').click()" style="padding:6px 12px">Choose image</button>
      <input type="file" id="avpick" accept="image/*" style="display:none" onchange="pickAvatar(this)"></div>
    </div>
    <input type="hidden" id="ed_id">
    <label class="cap">Name</label>
    <input id="ed_name">
    <label class="cap">Description</label>
    <textarea id="ed_desc" style="min-height:140px"></textarea>
    <label class="cap">Personality</label>
    <textarea id="ed_personality" style="min-height:100px"></textarea>
    <label class="cap">Scenario</label>
    <textarea id="ed_scenario" style="min-height:70px"></textarea>
    <label class="cap">First message (greeting)</label>
    <textarea id="ed_first" style="min-height:120px"></textarea>
    <label class="cap">Example dialogue</label>
    <textarea id="ed_mesex" style="min-height:120px"></textarea>
    <label class="cap">System prompt override <small>— optional</small></label>
    <textarea id="ed_sysp" style="min-height:60px"></textarea>
    <label class="cap">Post-history instructions <small>— optional</small></label>
    <textarea id="ed_phi" style="min-height:60px"></textarea>
    <label class="cap">Tags <small>— comma separated</small></label>
    <input id="ed_tags">
    <input type="hidden" id="ed_creator">
    <label class="cap">API profile <small>— uses default unless changed</small></label>
    <select id="ed_profile" style="width:100%;padding:8px;background:#2a2b2e;border:1px solid #444;color:#ddd;border-radius:4px"></select>
    <div style="margin-top:18px">
    <button onclick="saveCard()">Save</button>
    <button onclick="clearEd()" style="background:#444">Clear</button>
    <button onclick="document.getElementById('imp').click()" style="background:#5a4a7c">Import card…</button>
    <input type="file" id="imp" accept=".png,.json" style="display:none" onchange="importCard(this)">
    </div>
  </div>
</main>
</div>
<script src="layout.js"></script>
<script>
const H=()=>({'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.mp_token||'')});
const api=(p,b)=>fetch(`/api/${p}`,{method:'POST',headers:H(),body:JSON.stringify(b||{})}).then(r=>r.json());
const get=p=>fetch(`/api/${p}`,{headers:H()}).then(r=>r.json());
const $=id=>document.getElementById(id);

let me='';
async function load(){
  const [{cards},who]=await Promise.all([get('cards'),get('me')]);
  me=who.handle;
  $('list').innerHTML=(cards||[]).map(c=>`
    <div class="card" style="cursor:pointer" onclick='edit(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
      <img src="${c.avatar?'/api/avatar?id='+c.id:'/api/avatar?id=0'}" onerror="this.style.visibility='hidden'">
      <div>
        <div class="name">${esc(c.name)}</div>
        <div class="desc">${esc(c.description)}</div>
        <div class="meta">#${c.id} · owner ${esc(c.owner||'?')}${profName(c)}</div>
      </div>
      <div class="btns" id="btns${c.id}" onclick="event.stopPropagation()">
        ${c.owner===me?`<button style="background:${c.is_persona?'#4a7c3a':'#5a5a4a'}" onclick="api('persona',{cardId:${c.is_persona?'null':c.id}}).then(load)">★${c.is_persona?' persona':''}</button>`:''}
        ${c.owner===me?`<button class="del" onclick="del(${c.id})">Delete</button>`:''}
      </div>
    </div>`).join('');
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let profs=[];
const profName=c=>c.profile_id?(' · '+(profs.find(p=>p.id===c.profile_id)?.name||'custom api')):'';
async function loadProfs(){
  const {profiles}=await get('profiles');
  profs=profiles||[];
  $('ed_profile').innerHTML='<option value="">— default —</option>'+
    profs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
}

function edit(c){
  $('ed_av').src=c.avatar?'/api/avatar?id='+c.id+'&t='+Date.now():'';$('edtitle').textContent='Edit '+c.name;$('ed_id').value=c.id;$('ed_name').value=c.name;$('ed_desc').value=c.description;$('ed_personality').value=c.personality||'';$('ed_scenario').value=c.scenario||'';$('ed_first').value=c.first_message||'';$('ed_mesex').value=c.mes_example||'';$('ed_sysp').value=c.system_prompt||'';$('ed_phi').value=c.post_history_instructions||'';$('ed_tags').value=JSON.parse(c.tags||'[]').join(', ');$('ed_creator').value=c.creator||'';$('ed_profile').value=c.profile_id||'';scrollTo(0,0)}
function pickAvatar(inp){
  const f=inp.files[0];if(!f)return;
  const img=new Image();
  img.onload=async()=>{
    const MAX=512,s=Math.min(1,MAX/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const url=cv.toDataURL('image/png'),b64=url.split(',')[1],id=$('ed_id').value;
    if(id){const r=await api('cards/avatar',{id:Number(id),png_b64:b64});
      if(r.error)alert(r.error);else $('ed_av').src='/api/avatar?id='+id+'&t='+Date.now();}
    else{$('ed_av').src=url;$('ed_av').dataset.pending=b64;}
  };
  img.src=URL.createObjectURL(f);
}
function clearEd(){$('edtitle').textContent='New character';['ed_id','ed_name','ed_desc','ed_personality','ed_scenario','ed_first','ed_mesex','ed_sysp','ed_phi','ed_tags','ed_creator'].forEach(i=>$(i).value='');$('ed_profile').value='';$('ed_av').src='';$('ed_av').dataset.pending=''}

async function saveCard(){
  const id=$('ed_id').value;
  const b={name:$('ed_name').value.trim(),description:$('ed_desc').value,personality:$('ed_personality').value,scenario:$('ed_scenario').value,first_message:$('ed_first').value,mes_example:$('ed_mesex').value,system_prompt:$('ed_sysp').value,post_history_instructions:$('ed_phi').value,tags:$('ed_tags').value,creator:me,profileId:Number($('ed_profile').value)||null};
  if(!b.name)return alert('needs a name');
  if(id)await api('cards/update',{id:Number(id),...b});
  else await api('cards',b);
  clearEd();load();
}
async function del(id){if(confirm('Delete this character?')){await api('cards/delete',{id});load()}}
async function addToRoom(id){await api('members',{room:Number(localStorage.mp_room||1),cardId:id,kind:'ai'});alert('added to current chat')}

async function importCard(input){
  const f=input.files[0];input.value='';
  if(!f)return;
  let r;
  if(f.name.endsWith('.json')){
    r=await api('cards/import',{card:await f.text()});
  }else{
    const b64=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.readAsDataURL(f)});
    r=await api('cards/import',{png_b64:b64});
  }
  if(r.error)return alert(r.error);
  alert('imported '+r.name);load();
}
Promise.all([load(),loadProfs()]);
</script>
</body>
</html>
