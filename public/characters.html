<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>RP · Characters</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui;background:#1a1b1e;color:#ddd;margin:0}
nav{display:flex;gap:14px;align-items:center;padding:8px 16px;background:#141517;border-bottom:1px solid #2a2b2e}
nav .brand{font-weight:700;margin-right:8px}
nav a{color:#9ab;text-decoration:none;padding:5px 10px;border-radius:5px;font-size:.95em}
nav a:hover{background:#232426;color:#ddd}
nav a.on{background:#2b3a5e;color:#fff}
main{max-width:860px;margin:24px auto;padding:0 16px}
input,textarea,button{padding:8px;background:#2a2b2e;border:1px solid #444;color:#ddd;border-radius:4px;width:100%;margin:3px 0}
button{background:#3a5ccc;cursor:pointer;border:none;width:auto}
button.del{background:#7c3a3a}
textarea{min-height:90px;font-family:inherit}
.card{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border:1px solid #2a2b2e;border-radius:6px;margin-bottom:10px;background:#141517}
.card .name{font-weight:700}
.card .desc{color:#abc;font-size:.9em;white-space:pre-wrap;margin-top:4px}
.card .meta{color:#567;font-size:.8em;margin-top:4px}
.card .btns{display:flex;flex-direction:column;gap:6px}
#editor{border:1px solid #2b3a5e;border-radius:6px;padding:14px;margin-bottom:18px;background:#191b24}
#editor h3{margin-top:0}
small{color:#789}
</style>
</head>
<body>
<nav>
  <span class="brand">RP</span>
  <a href="/">Chat</a>
  <a href="/characters.html" class="on">Characters</a>
</nav>
<main>
  <div id="editor">
    <h3 id="edtitle">New character</h3>
    <input type="hidden" id="ed_id">
    <input id="ed_name" placeholder="Name">
    <textarea id="ed_desc" placeholder="Description — personality, appearance, how they speak"></textarea>
    <textarea id="ed_first" placeholder="First message (greeting) — optional"></textarea>
    <button onclick="saveCard()">Save</button>
    <button onclick="clearEd()" style="background:#444">Clear</button>
  </div>
  <div id="list"></div>
</main>
<script>
const api=(p,b)=>fetch(`/api/${p}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
const get=p=>fetch(`/api/${p}`).then(r=>r.json());
const $=id=>document.getElementById(id);

async function load(){
  const {cards}=await get('cards');
  $('list').innerHTML=(cards||[]).map(c=>`
    <div class="card">
      <div>
        <div class="name">${esc(c.name)}</div>
        <div class="desc">${esc(c.description)}</div>
        <div class="meta">#${c.id} · owner ${esc(c.owner||'?')}</div>
      </div>
      <div class="btns">
        <button onclick='edit(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Edit</button>
        <button onclick="addToRoom(${c.id})">+ Chat</button>
        <button class="del" onclick="del(${c.id})">Delete</button>
      </div>
    </div>`).join('');
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function edit(c){$('edtitle').textContent='Edit '+c.name;$('ed_id').value=c.id;$('ed_name').value=c.name;$('ed_desc').value=c.description;$('ed_first').value=c.first_message||'';scrollTo(0,0)}
function clearEd(){$('edtitle').textContent='New character';$('ed_id').value='';$('ed_name').value='';$('ed_desc').value='';$('ed_first').value=''}

async function saveCard(){
  const id=$('ed_id').value;
  const b={name:$('ed_name').value.trim(),description:$('ed_desc').value,first_message:$('ed_first').value};
  if(!b.name)return alert('needs a name');
  if(id)await api('cards/update',{id:Number(id),...b});
  else await api('cards',b);
  clearEd();load();
}
async function del(id){if(confirm('Delete this character?')){await api('cards/delete',{id});load()}}
async function addToRoom(id){await api('members',{room:Number(localStorage.mp_room||1),cardId:id,kind:'ai'});alert('added to current chat')}
load();
</script>
</body>
</html>
