name: PR Autofill

# Keeps the PR title aligned with Conventional Commits and maintains the commit
# list above any hand-written PR body.
# - Title: highest-bump conventional commit in the PR (BREAKING/! > feat > rest).
# - Body: replaces/insert an autofilled commit-list block above the manual body.
#   Merge commits can inherit the body via repo squash/merge settings (PR_BODY).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  autofill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fill title and commit list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE" --depth=1 2>/dev/null || git fetch origin
          COMMITS=$(git log --format='%h %s' "$BASE..$HEAD")

          # Highest-bump commit type wins the title.
          # BREAKING/! commits first, then any conventional type.
          TITLE=$(echo "$COMMITS" | grep -oP '(?<= )\w+(\(.+\))?!:.*' | head -1 || true)
          [ -z "$TITLE" ] && TITLE=$(echo "$COMMITS" | grep -oP '(?<= )(feat|fix|chore|docs|refactor|ci|test|perf|style)(\(.+\))?:.*' | head -1 || true)
          [ -z "$TITLE" ] && TITLE=$(echo "$COMMITS" | head -1 | sed 's/^[^ ]* //')
          [ -z "$TITLE" ] && TITLE="Update"

          LIST=$(echo "$COMMITS" | sed 's/^/- /')
          [ -z "$LIST" ] && LIST="- (no commits found)"

          START='<!-- autofill:commits:start -->'
          END='<!-- autofill:commits:end -->'
          BLOCK=$(printf '%s\n## Commits\n%s\n%s' "$START" "$LIST" "$END")

          EXISTING=$(gh pr view "$PR_NUMBER" --json body -q '.body // ""')
          # Strip any previous autofill block; keep the rest as manual body.
          MANUAL=$(printf '%s' "$EXISTING" | perl -0777 -pe 's/<!-- autofill:commits:start -->.*?<!-- autofill:commits:end -->\n?//s')
          # Trim leading/trailing blank lines from manual content.
          MANUAL=$(printf '%s' "$MANUAL" | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')

          if [ -n "$MANUAL" ]; then
            BODY=$(printf '%s\n\n%s' "$BLOCK" "$MANUAL")
          else
            BODY="$BLOCK"
          fi

          gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          echo "title: $TITLE"
          echo "$BODY"
