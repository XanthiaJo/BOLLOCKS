name: PR Autofill

# On PR open: title = highest-bump conventional commit (BREAKING/! > feat >
# rest), body = every commit as `- <sha> <message>`. Merge commits inherit
# the body via the repo's squash/merge commit-message settings (PR_BODY).

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  autofill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fill title and body from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE" --depth=1 2>/dev/null || git fetch origin
          COMMITS=$(git log --format='%h %s' "$BASE..$HEAD")

          # Highest-bump commit type wins the title.
          # BREAKING/! commits first, then any conventional type.
          TITLE=$(echo "$COMMITS" | grep -oP '(?<= )\w+(\(.+\))?!:.*' | head -1 || true)
          [ -z "$TITLE" ] && TITLE=$(echo "$COMMITS" | grep -oP '(?<= )(feat|fix|chore|docs|refactor|ci|test|perf|style)(\(.+\))?:.*' | head -1 || true)
          [ -z "$TITLE" ] && TITLE=$(echo "$COMMITS" | head -1 | sed 's/^[^ ]* //')
          [ -z "$TITLE" ] && TITLE="Update"

          BODY=$(echo "$COMMITS" | sed 's/^/- /')
          [ -z "$BODY" ] && BODY="- (no commits found)"

          gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          echo "title: $TITLE"; echo "$BODY"
