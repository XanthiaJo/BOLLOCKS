name: PR Autofill

# Fills a PR's body from its commits when it's opened — every commit in the
# PR as `- <sha> <message>`. The title is left alone (whatever's typed).

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  autofill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fill body from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE" --depth=1 2>/dev/null || git fetch origin
          BODY=$(git log --format='%h %s' "$BASE..$HEAD" 2>/dev/null | sed 's/^/- /')
          [ -z "$BODY" ] && BODY="- (no commits found)"
          gh pr edit "$PR_NUMBER" --body "$BODY"
          echo "$BODY"
