name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tee keeps the step's pipefail failure while saving output for the
      # pr-check-comments.yml workflow_run follower to post as a PR comment
      # (this job can't comment itself — fork PRs get a read-only token).
      - name: Run lint
        run: npm run lint 2>&1 | tee lint-output.txt

      - name: Stage lint output for commenter
        if: failure()
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          echo "${{ github.event.pull_request.head.sha }}" > pr-sha.txt

      - name: Upload lint output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-failure
          path: |
            lint-output.txt
            pr-number.txt
            pr-sha.txt
          retention-days: 5

  test:
    name: Upgrade + API contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # test/upgrade.test.js builds a DB with the base and deployed branches,
      # then migrates it with this PR's code.
      - name: Fetch upgrade-from branches
        run: |
          for b in $(printf '%s\n' "$BASE_REF" dev beta master | sort -u); do
            git fetch --no-tags --depth=1 origin "+refs/heads/$b:refs/remotes/origin/$b" || echo "::warning::could not fetch $b"
          done
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test 2>&1 | tee test-output.txt
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Stage test output for commenter
        if: failure()
        run: |
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          echo "${{ github.event.pull_request.head.sha }}" > pr-sha.txt

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure
          path: |
            test-output.txt
            pr-number.txt
            pr-sha.txt
          retention-days: 5
