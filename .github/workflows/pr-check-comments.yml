name: PR check comments

# Runs in the base-repo context (write token) after a pull_request-triggered
# "PR checks" run completes. Each failed job uploads its output as a
# "<job>-failure" artifact; this workflow downloads those and posts them on
# the PR. It never checks out or executes PR code, so it's safe to run for
# forks — this is what gets failure comments working on fork PRs.
on:
  workflow_run:
    workflows: ["PR checks"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read # to download the triggering run's artifacts

jobs:
  comment:
    # Only runs triggered by PRs; pushes to branches have no PR to comment on.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # One "<kind>-failure" artifact per failed job; absent artifact =
          # that job passed. Each failure gets its own comment (history).
          for KIND in lint test; do
            gh run download "$RUN_ID" -n "$KIND-failure" -D "fail-$KIND" 2>/dev/null || continue

            PR_NUMBER=$(cat "fail-$KIND/pr-number.txt")
            SHA=$(cat "fail-$KIND/pr-sha.txt")
            # Comments cap at ~64k chars; keep the tail where the errors are.
            TAIL=$(tail -c 60000 "fail-$KIND/$KIND-output.txt")
            case "$KIND" in
              lint) TITLE='Lint' ;;
              test) TITLE='Tests' ;;
            esac
            BODY=$(printf '**%s failed** on %s — [workflow run](%s)\n\n~~~\n%s\n~~~' "$TITLE" "$SHA" "$RUN_URL" "$TAIL")
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$BODY" > /dev/null
          done
